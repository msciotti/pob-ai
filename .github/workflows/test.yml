name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-mcp:
    name: MCP Server Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # "Run workspace tests" below (`pnpm -r test`) includes @poe-ai/plugin-pob's
      # own test suite, which needs the same LuaJIT binary + PoB source that
      # test-pob-runtime relies on — without this cache they were never present
      # here, so those data-dependent tests would time out or report zero-value
      # stats. Same cache key/steps as the test-pob-runtime job below.
      - name: Cache PoB data (LuaJIT binary + PoB source)
        id: pob-cache
        uses: actions/cache@v4
        with:
          path: packages/plugin-pob/pob-data
          key: pob-data-${{ runner.os }}-luajit-v2.1-pob-master-${{ hashFiles('packages/plugin-pob/scripts/download-*.js') }}
          restore-keys: |
            pob-data-${{ runner.os }}-luajit-v2.1-pob-master-

      - name: Install build tools (for LuaJIT)
        if: steps.pob-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pob-data/LuaJIT are no longer fetched by postinstall (section 1d/2b:
      # heavy downloads only run for plugins a user actually enables, via
      # `poe-ai init` or this direct script call) — CI has to ask for them
      # explicitly. The pob-cache step above still short-circuits this once
      # `pob-data/.download-complete` + the built luajit binary are cached.
      - name: Download PoB data (pob-data + LuaJIT)
        run: pnpm --filter @poe-ai/plugin-pob run setup

      - name: Build core
        run: pnpm --filter @poe-ai/core build

      - name: Build project
        run: pnpm build

      - name: Run MCP tests
        run: pnpm test:mcp

      - name: Run workspace tests
        run: pnpm workspace:test

      - name: Run MCP tests with coverage
        run: pnpm test:mcp:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          files: ./coverage/coverage-final.json
          flags: mcp-server
          name: mcp-server-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-pob-runtime:
    name: PoB Runtime Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache PoB data (LuaJIT binary + PoB source)
        id: pob-cache
        uses: actions/cache@v4
        with:
          path: packages/plugin-pob/pob-data
          key: pob-data-${{ runner.os }}-luajit-v2.1-pob-master-${{ hashFiles('packages/plugin-pob/scripts/download-*.js') }}
          restore-keys: |
            pob-data-${{ runner.os }}-luajit-v2.1-pob-master-

      - name: Install build tools (for LuaJIT)
        if: steps.pob-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # See the same step in the MCP Server Tests job above — no longer a
      # postinstall side effect.
      - name: Download PoB data (pob-data + LuaJIT)
        run: pnpm --filter @poe-ai/plugin-pob run setup

      - name: Build core
        run: pnpm --filter @poe-ai/core build

      - name: Build plugin-pob
        run: pnpm --filter @poe-ai/plugin-pob build

      - name: Run PoB runtime tests
        run: pnpm --filter @poe-ai/plugin-pob test

  mcp-e2e:
    name: MCP E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm -r build` does not reliably wait for a dependency's build to fully
      # land on disk before starting a dependent's — every package here resolves
      # @poe-ai/core's types via its built dist/index.d.ts, so building core first
      # (as the other two jobs above already do) avoids a race where e.g.
      # plugin-pob's tsc starts before core/dist exists and fails with "Cannot find
      # module '@poe-ai/core'". Reproduced this locally: a `pnpm -r build` from a
      # clean checkout (no pre-existing dist/ anywhere) fails the same way.
      - name: Build core
        run: pnpm --filter @poe-ai/core build

      - name: Build all packages
        run: pnpm -r build

      # Real-plugin smoke tests (plugin-wiki over the network, plugin-pob over
      # LuaJIT) are env-gated (WIKI_INTEGRATION / POB_INTEGRATION) and stay off
      # here by default — this only runs the hermetic stdio/HTTP e2e suites
      # against the fixture plugin.
      - name: Run MCP e2e tests
        run: pnpm --filter @poe-ai/integration-tests test
