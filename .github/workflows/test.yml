name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-mcp:
    name: MCP Server Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @poe-ai/core build

      - name: Build project
        run: pnpm build

      - name: Run MCP tests
        run: pnpm test:mcp

      - name: Run workspace tests
        run: pnpm workspace:test

      - name: Run MCP tests with coverage
        run: pnpm test:mcp:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          files: ./coverage/coverage-final.json
          flags: mcp-server
          name: mcp-server-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-pob-runtime:
    name: PoB Runtime Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache PoB data (LuaJIT binary + PoB source)
        id: pob-cache
        uses: actions/cache@v4
        with:
          path: packages/plugin-pob/pob-data
          key: pob-data-${{ runner.os }}-luajit-v2.1-pob-master-${{ hashFiles('packages/plugin-pob/scripts/download-*.js') }}
          restore-keys: |
            pob-data-${{ runner.os }}-luajit-v2.1-pob-master-

      - name: Install build tools (for LuaJIT)
        if: steps.pob-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @poe-ai/core build

      - name: Build plugin-pob
        run: pnpm --filter @poe-ai/plugin-pob build

      - name: Run PoB runtime tests
        run: pnpm --filter @poe-ai/plugin-pob test
